<title>Energy Sector Structures</title>

<style>
:root{
  /* Layout: country switcher, then per country a stacked structure chart and three reference tables (A institutions, B state companies, C other companies). CFA-notebook navy palette, light + dark. */
  --ink:#1b2a44; --muted:#5b6880; --bg:#dfe4eb; --paper:#fdfeff; --line:#cfd8e6;
  --navy:#1e3358; --primary:#1e3a6e; --accent:#2f6fd6;
  --gov:#d4e5fa; --gov-ink:#1b2a44;
  --inv:#dcefe6; --inv-ink:#1d4a37;
  --reg:#e7eef8;
  --feat:#f1ead9; --feat-ink:#3b3220;
  --tag-own-bg:#e1f2e8; --tag-own:#1f7a4d;
  --tag-reg-bg:#e7eef8; --tag-reg:#1e3a6e;
  --tag-pvt-bg:#f3ecdc; --tag-pvt:#7a5a12;
  --f:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ecf5; --muted:#9aa8bf; --bg:#0d1420; --paper:#141d2c; --line:#26334a;
  --navy:#9fc0f0; --primary:#9fc0f0; --accent:#5b93ea;
  --gov:#1f3456; --gov-ink:#e6ecf5;
  --inv:#173a2d; --inv-ink:#d4f0e2;
  --reg:#1a2740;
  --feat:#3a3222; --feat-ink:#f3ead6;
  --tag-own-bg:#143a26; --tag-own:#7fd6a6;
  --tag-reg-bg:#1a2c4c; --tag-reg:#a9c6f2;
  --tag-pvt-bg:#3b3019; --tag-pvt:#e3c27a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#e6ecf5; --muted:#9aa8bf; --bg:#0d1420; --paper:#141d2c; --line:#26334a;
  --navy:#9fc0f0; --primary:#9fc0f0; --accent:#5b93ea;
  --gov:#1f3456; --gov-ink:#e6ecf5;
  --inv:#173a2d; --inv-ink:#d4f0e2;
  --reg:#1a2740;
  --feat:#3a3222; --feat-ink:#f3ead6;
  --tag-own-bg:#143a26; --tag-own:#7fd6a6;
  --tag-reg-bg:#1a2c4c; --tag-reg:#a9c6f2;
  --tag-pvt-bg:#3b3019; --tag-pvt:#e3c27a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
a{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{padding:28px 0 6px}
header h1{margin:0;font-size:28px;line-height:1.2;color:var(--navy);text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tabs{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 0}
.tabs .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;min-height:42px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.model{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:6px 0 18px}
.model .c{font-size:30px;font-weight:700;color:var(--accent);line-height:1.15}
.model .t{font-size:18px;font-weight:600;margin:4px 0 6px}
.model p{margin:0;color:var(--ink);max-width:70ch}
h2{font-size:21px;margin:26px 0 12px;color:var(--navy);text-wrap:balance}
/* structure chart */
.chart{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.box{border-radius:12px;padding:14px 12px;text-align:center}
.box b{display:block;font-size:19px;line-height:1.25}
.box span{display:block;font-size:13.5px;line-height:1.35;margin-top:3px;opacity:.85}
.top{background:var(--gov);color:var(--gov-ink)}
.top b{font-size:22px}
.arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1}
.inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.inst .box{background:var(--gov);color:var(--gov-ink)}
.inst .box.inv{background:var(--inv);color:var(--inv-ink)}
.inst .box.reg{background:var(--reg);color:var(--ink);border:1px dashed var(--line)}
.divider{border-top:1px solid var(--line);margin:6px 0 2px}
.sub{text-align:center;font-weight:600;font-size:17px;margin:2px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grp{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grp h3{margin:0 0 6px;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.tag.own{background:var(--tag-own-bg);color:var(--tag-own)}
.tag.reg{background:var(--tag-reg-bg);color:var(--tag-reg)}
.tag.pvt{background:var(--tag-pvt-bg);color:var(--tag-pvt)}
.grp ul{margin:0;padding-left:18px}
.grp li{margin:3px 0;font-size:15px}
.grp li small{color:var(--muted);font-size:13px}
.feat{background:var(--feat);color:var(--feat-ink)}
.note{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 0}
/* tables */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl .r{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.tbl .r:first-child{border-top:0}
.tbl .r.h{background:var(--reg);font-weight:600;font-size:14px;color:var(--primary)}
.tbl .n{font-weight:600}
.tbl .own{display:block;font-size:13px;color:var(--muted);margin-top:4px}
@media (max-width:520px){.tbl .r{grid-template-columns:1fr;gap:4px}.tbl .r.h{display:none}}
.flag{background:var(--paper);border:1px solid var(--line);border-left:4px solid #c08a1e;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px}
.src{font-size:13px;color:var(--muted);margin:18px 0 0;padding-left:18px}
.src li{margin-bottom:4px}
footer{color:var(--muted);font-size:12.5px;padding:30px 0 50px}

.grp ul{padding-left:0;padding-inline-start:18px}
.src{padding-left:0;padding-inline-start:18px}
.flag{border-left:1px solid var(--line);border-inline-start:4px solid #c08a1e}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#lang{font:600 14px var(--f);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--primary);cursor:pointer;white-space:nowrap;margin-top:4px}
html[dir="rtl"] body{line-height:1.7}
html[dir="rtl"] .tbl .r>div{text-align:start}
html[dir="rtl"] #edbar{right:auto;left:12px}
</style>
</head>

let LANG="en";
try{const q=new URLSearchParams(location.search).get("lang");LANG=(q==="ar"||q==="en")?q:(localStorage.getItem("lang")||"en");}catch(e){}
const DATA=()=>LANG==="ar"?C_AR:C;
function applyLang(){const ar=LANG==="ar";document.documentElement.lang=ar?"ar":"en";document.documentElement.dir=ar?"rtl":"ltr";
  document.getElementById("t1").textContent=UI[LANG].title;document.getElementById("t2").textContent=UI[LANG].sub;document.title=UI[LANG].title;
  document.getElementById("lang").textContent=ar?"English":"عربي";}
document.getElementById("lang").addEventListener("click",()=>{LANG=LANG==="ar"?"en":"ar";try{localStorage.setItem("lang",LANG)}catch(e){};applyLang();render(CUR);});
applyLang();
let CUR="oman";
function render(id){
  CUR=id; const d=DATA()[id], U=UI[LANG];
  const E=(p,v)=>`<span data-p="${p}">${esc(v)}</span>`;
  const inst=d.inst.map(([n,s,k],i)=>`<div class="box ${k}"><b>${E(`inst.${i}.0`,n)}</b><span>${E(`inst.${i}.1`,s)}</span></div>`).join("");
  const grps=d.groups.map((g,gi)=>`<div class="grp"><h3>${E(`groups.${gi}.t`,g.t)}</h3><span class="tag ${g.tag}">${U["tag_"+g.tag]}</span><ul>${g.items.map(([a,b],j)=>`<li>${E(`groups.${gi}.items.${j}.0`,a)}${b?` <small>· ${E(`groups.${gi}.items.${j}.1`,b)}</small>`:""}</li>`).join("")}</ul></div>`).join("");
  const table=(key,head,rows,three)=>`<div class="tbl"><div class="r h"><div>${head[0]}</div><div>${head[1]}</div></div>${rows.map((r,i)=>`<div class="r"><div class="n">${E(`${key}.${i}.0`,r[0])}</div><div>${E(`${key}.${i}.1`,r[1])}${three&&r[2]?`<span class="own">${U.own} ${E(`${key}.${i}.2`,r[2])}</span>`:""}</div></div>`).join("")}</div>`;
  document.getElementById("view").innerHTML=`
  <section class="model"><div class="c">${E("name",d.name)}</div><div class="t">${E("model",d.model)}</div><p>${E("modelText",d.modelText)}</p></section>

    <div class="inst">${inst}</div>
    <div class="divider"></div>
    <div class="sub"><span data-u="commercial">${esc(U.commercial)}</span></div>
    <div class="groups">${grps}</div>
    <div class="arrow" aria-hidden="true">↓</div>
    <div class="box feat"><b>${E("feat.0",d.feat[0])}</b><span>${E("feat.1",d.feat[1])}</span><span>${E("feat.2",d.feat[2])}</span></div>
    <p class="note">${E("note",d.note)}</p>
  </div>
  <h2><span data-u="hA">${esc(U.hA)}</span></h2>
  ${table("A",[U.inst,U.role],d.A,false)}
  <h2><span data-u="hB">${esc(U.hB)}</span></h2>
  ${table("B",[U.co,U.does],d.B,true)}
  <h2><span data-u="hC">${esc(U.hC)}</span></h2>
  ${table("Cc",[U.co,U.pos],d.Cc,false)}
  ${d.flag?`<div class="flag"><b>${U.check}</b> ${E("flag",d.flag)}</div>`:""}
  <ol class="src">${d.src.map(([t,u],i)=>`<li><a href="${u}">${E(`src.${i}.0`,t)}</a></li>`).join("")}</ol>`;
  document.querySelectorAll("#tabs button").forEach(b=>{b.textContent=DATA()[b.dataset.id].name;b.setAttribute("aria-selected",b.dataset.id===id?"true":"false");});
  if(window.EDITING) setEditable(true);
}
const tabs=document.getElementById("tabs");
ORDER.forEach(id=>{const b=document.createElement("button");b.type="button";b.role="tab";b.dataset.id=id;b.textContent=C[id].name;
  b.addEventListener("click",()=>{render(id);try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}});tabs.appendChild(b);});
function fromHash(){const h=(location.hash||"").slice(1);render(C[h]?h:"oman");}
window.addEventListener("hashchange",fromHash);fromHash();

<div id="edbar" hidden><button id="edT">✏️ Edit</button><button id="edS" hidden>Save</button><button id="edC" class="sec" hidden>Cancel</button></div>

<script>
/* In-page editor: open the page with ?edit at the end of the link. Saves straight to GitHub. */
(function(){
  const REPO="alnassri8/Energy-sector-setup", FILE="index.html", BRANCH="main";
  if(!/[?&]edit\b/.test(location.search)) return;
  const bar=document.getElementById("edbar"), bT=document.getElementById("edT"), bS=document.getElementById("edS"), bC=document.getElementById("edC"), msg=document.getElementById("edmsg");
  bar.hidden=false;
  const ORIG=JSON.stringify({en:C,ar:C_AR,ui:UI}); let dirty=false;
  const say=(t,ms)=>{msg.textContent=t;msg.style.display="block";clearTimeout(say.t);if(ms)say.t=setTimeout(()=>msg.style.display="none",ms);};
  const setPath=(obj,path,val)=>{const k=path.split(".");let o=obj;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;};
  window.setEditable=on=>{document.body.classList.toggle("editing",on);
    document.querySelectorAll("#view [data-p],[data-u]").forEach(el=>{el.contentEditable=on?"true":"false";
      if(on&&!el.dataset.w){el.dataset.w=1;
        el.addEventListener("input",()=>{const v=el.innerText.replace(/\n+/g," ").trim();if(el.dataset.u)UI[LANG][el.dataset.u]=v;else setPath(DATA()[CUR],el.dataset.p,v);dirty=true;});
        el.addEventListener("click",e=>{if(window.EDITING)e.preventDefault();});
        el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}});}});};
  const mode=on=>{window.EDITING=on;setEditable(on);bT.hidden=on;bS.hidden=!on;bC.hidden=!on;if(on)say(LANG==="ar"?"اضغط على أي نص لتعديله. يمكنك التنقل بين الدول.":"Tap any text to change it. Switch countries freely.",3500);};
  bT.onclick=()=>mode(true);
  bC.onclick=()=>{if(dirty&&!confirm("Discard your changes?"))return;const o=JSON.parse(ORIG);Object.keys(o.en).forEach(k=>C[k]=o.en[k]);Object.keys(o.ar).forEach(k=>C_AR[k]=o.ar[k]);Object.keys(o.ui).forEach(k=>UI[k]=o.ui[k]);applyLang();dirty=false;mode(false);render(CUR);};
  const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r);};
  const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
  bS.onclick=async()=>{
    if(!dirty){mode(false);return;}
    let tok=null;try{tok=localStorage.getItem("gh_edit_token");}catch(e){}
    if(!tok){tok=prompt("Paste your GitHub token (only needed once on this device):");if(!tok)return;tok=tok.trim();try{localStorage.setItem("gh_edit_token",tok);}catch(e){}}
    say("Saving…");
    const api=`https://api.github.com/repos/${REPO}/contents/${FILE}`, H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
    try{
      const g=await fetch(api+"?ref="+BRANCH+"&t="+Date.now(),{headers:H});
      if(g.status===401||g.status===403||g.status===404){try{localStorage.removeItem("gh_edit_token");}catch(e){}throw new Error("Token not accepted. Tap Save again and paste a valid token.");}
      if(!g.ok) throw new Error("GitHub error "+g.status);
      const j=await g.json(); const src=b64d(j.content);
      const a=src.indexOf("const C = {"), m=src.indexOf("\nconst C_AR = "), z=src.indexOf("\nconst ORDER=");
      if(a<0||m<0||z<0) throw new Error("Couldn't find the data block in the file.");
      const out=src.slice(0,a)+"const C = "+JSON.stringify(C,null,1)+";"+"\nconst C_AR = "+JSON.stringify(C_AR,null,1)+";"+"\nconst UI = "+JSON.stringify(UI)+";"+src.slice(z);
      const p=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify({message:"Edit text on page",content:b64e(out),sha:j.sha,branch:BRANCH})});
      if(!p.ok) throw new Error("Save failed ("+p.status+")");
      dirty=false; mode(false); say("Saved ✓ Live for everyone in about 1 minute.",5000);
    }catch(e){say(e.message,6000);}
  };
  window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
})();
</script>
